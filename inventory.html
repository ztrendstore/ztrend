<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventory · Shopora</title><link rel="stylesheet" href="../css/style.css"></head><body data-admin="1"><div class="admin-shell"><aside class="sidebar"><a class="brand" href="dashboard.html">SHOP<span>ORA</span></a><div class="muted" style="margin-top:7px;font-size:12px">Store control center</div><nav class="side-nav"><a class="" href="dashboard.html">Dashboard</a><a class="" href="products.html">Products</a><a class="" href="orders.html">Orders</a><a class="" href="customers.html">Customers</a><a class="" href="inventory.html">Inventory</a><a class="" href="coupons.html">Coupons</a><a class="" href="analytics.html">Analytics</a><a class="" href="settings.html">Settings</a><a href="../index.html">↗ View store</a><a href="../admin-login.html" data-logout>⇥ Logout</a></nav></aside><section class="admin-main"><header class="admin-top"><div><b>Inventory</b><div class="muted" style="font-size:12px">Admin workspace</div></div><div style="margin-left:auto"><a class="ghost-btn" href="add-product.html">＋ Add product</a></div></header><main class="admin-content"><div class="page-title"><h1>Inventory</h1><p>Monitor stock and low-stock products.</p></div><div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Product</th><th>Category</th><th>Stock</th><th>Status</th></tr></thead><tbody id="inv"></tbody></table></div></div><script>document.addEventListener('DOMContentLoaded',()=>{let d=db();document.getElementById('inv').innerHTML=d.products.map(p=>`<tr><td>${p.name}</td><td>${p.cat}</td><td>${p.stock}</td><td><span class="status ${p.stock<10?'bad':p.stock<20?'warn':'ok'}">${p.stock<10?'Low stock':p.stock===0?'Out of stock':'In stock'}</span></td></tr>`).join('')})</script></main></section></div><script src="../js/app.js"></script></body></html>
