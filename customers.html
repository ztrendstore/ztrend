<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customers · Shopora</title><link rel="stylesheet" href="../css/style.css"></head><body data-admin="1"><div class="admin-shell"><aside class="sidebar"><a class="brand" href="dashboard.html">SHOP<span>ORA</span></a><div class="muted" style="margin-top:7px;font-size:12px">Store control center</div><nav class="side-nav"><a class="" href="dashboard.html">Dashboard</a><a class="" href="products.html">Products</a><a class="" href="orders.html">Orders</a><a class="" href="customers.html">Customers</a><a class="" href="inventory.html">Inventory</a><a class="" href="coupons.html">Coupons</a><a class="" href="analytics.html">Analytics</a><a class="" href="settings.html">Settings</a><a href="../index.html">↗ View store</a><a href="../admin-login.html" data-logout>⇥ Logout</a></nav></aside><section class="admin-main"><header class="admin-top"><div><b>Customers</b><div class="muted" style="font-size:12px">Admin workspace</div></div><div style="margin-left:auto"><a class="ghost-btn" href="add-product.html">＋ Add product</a></div></header><main class="admin-content"><div class="page-title"><h1>Customers</h1><p>Customer records are created from completed checkout orders.</p></div><div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Phone</th><th>City</th><th>Orders</th></tr></thead><tbody id="customers"></tbody></table></div></div><script>document.addEventListener('DOMContentLoaded',()=>{let d=db(),m={};d.orders.forEach(o=>{let k=o.address.phone;m[k]=m[k]||{...o.address,n:0};m[k].n++});document.getElementById('customers').innerHTML=Object.values(m).map(x=>`<tr><td>${x.name}</td><td>${x.phone}</td><td>${x.city}</td><td>${x.n}</td></tr>`).join('')||'<tr><td colspan="4">No customers yet.</td></tr>'})</script></main></section></div><script src="../js/app.js"></script></body></html>
