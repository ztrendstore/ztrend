<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login · Shopora</title><link rel="stylesheet" href="css/style.css"></head><body><main class="login"><form class="login-card" id="login"><div class="brand">SHOP<span>ORA</span> ADMIN</div><h1>Welcome back</h1><p>Sign in to manage products, prices, orders, inventory, coupons and invoices.</p><div class="stack"><div class="field"><label>Email / Username</label><input id="u" value="admin" required></div><div class="field"><label>Password</label><input id="p" type="password" value="admin123" required></div><div id="err"></div><button class="primary">Sign in</button><div class="notice">Demo credentials: <b>admin</b> / <b>admin123</b></div></div></form></main><script>document.getElementById('login').onsubmit=e=>{e.preventDefault();if(['admin','admin@store.local'].includes(document.getElementById('u').value.trim())&&document.getElementById('p').value==='admin123'){localStorage.setItem('shopora_admin','1');location.href='admin/dashboard.html'}else document.getElementById('err').innerHTML='<div class="notice error">Invalid credentials.</div>'}</script></body></html>
