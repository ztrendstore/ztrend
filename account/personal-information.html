<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Personal Information | Shopora</title>

  <link
    rel="stylesheet"
    href="../css/style.css"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 90% 0%,
          rgba(142,224,0,.07),
          transparent 35%
        ),
        #f5f6f4;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: #111;
    }

    .feature-page {

      width: min(700px, calc(100% - 24px));

      margin: 0 auto;

      padding: 20px 0 40px;

    }

    .back-button {

      display: inline-flex;

      align-items: center;

      gap: 7px;

      margin-bottom: 18px;

      padding: 9px 12px;

      border-radius: 9px;

      border: 1px solid #dedfdc;

      background: rgba(255,255,255,.72);

      text-decoration: none;

      color: #333;

      font-size: 12px;

      font-weight: 600;

      backdrop-filter: blur(12px);

    }

    .feature-card {

      overflow: hidden;

      border-radius: 22px;

      background:
        linear-gradient(
          145deg,
          rgba(35,35,35,.92),
          rgba(7,7,7,.88)
        );

      border: 1px solid rgba(255,255,255,.13);

      box-shadow:
        0 20px 50px rgba(0,0,0,.18),
        inset 0 1px 0 rgba(255,255,255,.08);

      color: #fff;

    }

    .feature-head {

      padding: 22px 20px;

      border-bottom:
        1px solid rgba(255,255,255,.10);

    }

    .feature-label {

      margin-bottom: 6px;

      color: #8ee000;

      font-size: 9px;

      font-weight: 700;

      letter-spacing: 2px;

    }

    .feature-head h1 {

      margin: 0;

      font-size: 23px;

      letter-spacing: -.5px;

    }

    .feature-head p {

      margin: 7px 0 0;

      color: rgba(255,255,255,.50);

      font-size: 11px;

      line-height: 1.5;

    }

    .feature-body {

      padding: 20px;

    }

    .profile-top {

      display: flex;

      align-items: center;

      gap: 13px;

      margin-bottom: 20px;

    }

    .avatar {

      width: 55px;

      height: 55px;

      flex: 0 0 55px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 50%;

      background:
        linear-gradient(
          145deg,
          #444,
          #151515
        );

      border: 1px solid rgba(255,255,255,.14);

      font-size: 20px;

      font-weight: 700;

    }

    .profile-top strong {

      display: block;

      font-size: 15px;

      margin-bottom: 4px;

    }

    .profile-top span {

      color: rgba(255,255,255,.48);

      font-size: 10px;

    }

    .info-box {

      padding: 15px;

      margin-bottom: 10px;

      border-radius: 13px;

      border:
        1px solid rgba(255,255,255,.09);

      background:
        rgba(255,255,255,.045);

    }

    .info-box small {

      display: block;

      margin-bottom: 6px;

      color: rgba(255,255,255,.40);

      font-size: 9px;

      font-weight: 700;

      letter-spacing: 1px;

      text-transform: uppercase;

    }

    .info-box strong {

      font-size: 13px;

      font-weight: 600;

    }

    .edit-button {

      width: 100%;

      height: 44px;

      margin-top: 8px;

      border: 1px solid #8ee000;

      border-radius: 10px;

      background: #8ee000;

      color: #111;

      font-size: 12px;

      font-weight: 700;

      cursor: pointer;

    }

    @media (min-width: 601px) {

      .feature-page {

        padding-top: 35px;

      }

    }

  </style>

</head>


<body>

  <main class="feature-page">

    <a
      href="profile.html"
      class="back-button"
    >
      ← Back
    </a>


    <section class="feature-card">

      <header class="feature-head">

        <div class="feature-label">
          MY ACCOUNT
        </div>

        <h1>
          Personal Information
        </h1>

        <p>
          View and manage your personal account details.
        </p>

      </header>


      <div class="feature-body">

        <div class="profile-top">

          <div class="avatar">
            R
          </div>

          <div>

            <strong>
              Riyaz
            </strong>

            <span>
              Account Profile
            </span>

          </div>

        </div>


        <div class="info-box">

          <small>
            First Name
          </small>

          <strong>
            Riyaz
          </strong>

        </div>


        <div class="info-box">

          <small>
            Last Name
          </small>

          <strong>
            Your Last Name
          </strong>

        </div>


        <div class="info-box">

          <small>
            Email
          </small>

          <strong>
            your@email.com
          </strong>

        </div>


        <div class="info-box">

          <small>
            Mobile
          </small>

          <strong>
            +91 XXXXX XXXXX
          </strong>

        </div>


        <button
          class="edit-button"
          type="button"
        >
          Edit Information
        </button>

      </div>

    </section>

  </main>

</body>

</html>
