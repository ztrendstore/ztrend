<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Personal Information | Shopora</title>

  <link rel="stylesheet" href="../css/style.css">

  <style>
    /* =====================================================
       SHOPORA — PERSONAL INFORMATION
       Standalone account page
    ===================================================== */

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% 0%, rgba(142,224,0,.06), transparent 30%),
        #f5f6f4;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    /* =====================================================
       PAGE
    ===================================================== */

    .profile-page {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      padding: 38px 0 70px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #666;
      text-decoration: none;
      font-size: 13px;
      margin-bottom: 28px;
      transition: .2s ease;
    }

    .back-link:hover {
      color: #76bd00;
    }

    .page-intro {
      margin-bottom: 28px;
    }

    .page-intro-label {
      display: block;
      margin-bottom: 8px;
      color: #777;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2.2px;
    }

    .page-intro h1 {
      margin: 0;
      font-size: 38px;
      line-height: 1.1;
      letter-spacing: -1.4px;
      font-weight: 700;
    }

    /* =====================================================
       MAIN LAYOUT
    ===================================================== */

    .profile-layout {
      display: grid;
      grid-template-columns: 275px minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }

    /* =====================================================
       GLASS PROFILE PANEL
    ===================================================== */

    .profile-glass {
      position: sticky;
      top: 24px;
      overflow: hidden;

      padding: 25px;

      border-radius: 22px;

      background:
        linear-gradient(
          145deg,
          rgba(35,35,35,.84),
          rgba(7,7,7,.72)
        );

      border: 1px solid rgba(255,255,255,.13);

      box-shadow:
        0 22px 55px rgba(0,0,0,.22),
        inset 0 1px 0 rgba(255,255,255,.09);

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      color: #fff;
    }

    .profile-glass::before {
      content: "";
      position: absolute;
      width: 150px;
      height: 150px;
      top: -80px;
      right: -60px;
      border-radius: 50%;
      background: rgba(142,224,0,.10);
      filter: blur(35px);
      pointer-events: none;
    }

    .profile-glass-content {
      position: relative;
      z-index: 1;
    }

    .avatar {
      width: 82px;
      height: 82px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 17px;

      border-radius: 50%;

      background:
        linear-gradient(145deg, #444, #171717);

      border: 1px solid rgba(255,255,255,.16);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.12),
        0 12px 30px rgba(0,0,0,.25);

      font-size: 29px;
      font-weight: 700;
    }

    .profile-glass h2 {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 700;
    }

    .profile-glass p {
      margin: 0;
      color: rgba(255,255,255,.56);
      font-size: 13px;
      line-height: 1.55;
    }

    .glass-line {
      height: 1px;
      margin: 23px 0 20px;
      background: rgba(255,255,255,.10);
    }

    .profile-status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,.65);
      font-size: 12px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #8ee000;
      box-shadow: 0 0 12px rgba(142,224,0,.6);
    }

    /* =====================================================
       INFORMATION CARD
    ===================================================== */

    .information-card {
      overflow: hidden;

      background: rgba(255,255,255,.92);

      border: 1px solid #e5e7e3;
      border-radius: 22px;

      box-shadow:
        0 14px 40px rgba(0,0,0,.05);
    }

    .information-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;

      padding: 28px 30px 23px;

      border-bottom: 1px solid #ededed;
    }

    .information-header h2 {
      margin: 0 0 6px;
      font-size: 21px;
    }

    .information-header p {
      margin: 0;
      color: #888;
      font-size: 13px;
    }

    /* =====================================================
       EDIT BUTTON
    ===================================================== */

    .edit-btn {
      flex-shrink: 0;

      border: 1px solid #111;
      border-radius: 9px;

      background: #111;
      color: #fff;

      padding: 11px 18px;

      font-size: 13px;
      font-weight: 600;

      cursor: pointer;

      transition:
        background .2s ease,
        border-color .2s ease,
        color .2s ease,
        transform .2s ease;
    }

    .edit-btn:hover {
      background: #8ee000;
      border-color: #8ee000;
      color: #111;
      transform: translateY(-1px);
    }

    /* =====================================================
       FORM
    ===================================================== */

    .profile-form {
      padding: 28px 30px 30px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 21px;
    }

    .field {
      min-width: 0;

      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      color: #555;
      font-size: 12px;
      font-weight: 700;
    }

    .field input,
    .field select {
      width: 100%;
      height: 48px;

      padding: 0 14px;

      border: 1px solid #dedfdd;
      border-radius: 10px;

      outline: none;

      background: #f8f9f7;
      color: #222;

      font-size: 14px;

      transition:
        border-color .2s ease,
        background .2s ease,
        box-shadow .2s ease;
    }

    .field input:disabled,
    .field select:disabled {
      color: #555;
      cursor: default;
      opacity: 1;
    }

    .field input:not(:disabled),
    .field select:not(:disabled) {
      background: #fff;
    }

    .field input:focus,
    .field select:focus {
      border-color: #8ee000;
      box-shadow: 0 0 0 3px rgba(142,224,0,.10);
    }

    /* =====================================================
       SAVE AREA
    ===================================================== */

    .save-area {
      display: none;

      justify-content: flex-end;
      gap: 10px;

      margin-top: 27px;
      padding-top: 23px;

      border-top: 1px solid #ededed;
    }

    .cancel-btn,
    .save-btn {
      min-height: 42px;

      padding: 0 18px;

      border-radius: 9px;

      font-size: 13px;
      font-weight: 600;

      cursor: pointer;
    }

    .cancel-btn {
      border: 1px solid #ddd;
      background: #fff;
      color: #333;
    }

    .cancel-btn:hover {
      background: #f5f5f5;
    }

    .save-btn {
      border: 1px solid #111;
      background: #111;
      color: #fff;
    }

    .save-btn:hover {
      border-color: #8ee000;
      background: #8ee000;
      color: #111;
    }

    /* =====================================================
       SAVED MESSAGE
    ===================================================== */

    .saved-message {
      display: none;

      margin-top: 18px;
      padding: 12px 14px;

      border: 1px solid rgba(142,224,0,.30);
      border-radius: 9px;

      background: rgba(142,224,0,.08);
      color: #4d7500;

      font-size: 13px;
    }

    /* =====================================================
       TABLET
    ===================================================== */

    @media (max-width: 850px) {

      .profile-page {
        width: min(100% - 30px, 700px);
        padding-top: 28px;
      }

      .profile-layout {
        grid-template-columns: 1fr;
      }

      .profile-glass {
        position: relative;
        top: auto;
      }

      .avatar {
        width: 70px;
        height: 70px;
        font-size: 25px;
      }
    }

    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 600px) {

      body {
        background:
          radial-gradient(
            circle at 90% 0%,
            rgba(142,224,0,.07),
            transparent 35%
          ),
          #f5f6f4;
      }

      .profile-page {
        width: 100%;
        padding: 22px 14px 45px;
      }

      .back-link {
        margin-bottom: 22px;
        padding-left: 2px;
      }

      .page-intro {
        margin-bottom: 20px;
        padding: 0 3px;
      }

      .page-intro-label {
        font-size: 10px;
        letter-spacing: 2px;
      }

      .page-intro h1 {
        font-size: 29px;
        letter-spacing: -1px;
      }

      .profile-layout {
        gap: 15px;
      }

      /* DARK GLASS PANEL */

      .profile-glass {
        padding: 20px;

        border-radius: 20px;

        background:
          linear-gradient(
            145deg,
            rgba(30,30,30,.76),
            rgba(5,5,5,.67)
          );

        border: 1px solid rgba(255,255,255,.14);

        box-shadow:
          0 18px 45px rgba(0,0,0,.20),
          inset 0 1px 0 rgba(255,255,255,.09);

        backdrop-filter: blur(24px) saturate(125%);
        -webkit-backdrop-filter: blur(24px) saturate(125%);
      }

      .profile-glass::after {
        content: "";
        position: absolute;
        inset: 1px;

        border-radius: 19px;

        background:
          linear-gradient(
            135deg,
            rgba(255,255,255,.05),
            transparent 35%
          );

        pointer-events: none;
      }

      .profile-glass-content {
        position: relative;
        z-index: 2;
      }

      .avatar {
        width: 64px;
        height: 64px;

        margin-bottom: 13px;

        font-size: 23px;
      }

      .profile-glass h2 {
        font-size: 20px;
        margin-bottom: 4px;
      }

      .profile-glass p {
        font-size: 12px;
      }

      .glass-line {
        margin: 18px 0 16px;
      }

      .profile-status {
        font-size: 11px;
      }

      /* INFORMATION CARD */

      .information-card {
        border-radius: 19px;
      }

      .information-header {
        display: block;
        padding: 21px 18px 18px;
      }

      .information-header h2 {
        font-size: 19px;
        margin-bottom: 5px;
      }

      .information-header p {
        font-size: 12px;
        line-height: 1.5;
        margin-bottom: 16px;
      }

      .edit-btn {
        width: 100%;
        min-height: 45px;
      }

      .profile-form {
        padding: 20px 18px 21px;
      }

      .form-grid {
        grid-template-columns: 1fr;
        gap: 17px;
      }

      .field.full {
        grid-column: auto;
      }

      .field label {
        font-size: 11px;
      }

      .field input,
      .field select {
        height: 46px;
        font-size: 13px;
      }

      .save-area {
        display: none;
        flex-direction: column-reverse;
        gap: 9px;
        margin-top: 21px;
        padding-top: 19px;
      }

      .cancel-btn,
      .save-btn {
        width: 100%;
        min-height: 44px;
      }
    }

    /* =====================================================
       SMALL PHONES
    ===================================================== */

    @media (max-width: 380px) {

      .profile-page {
        padding-left: 11px;
        padding-right: 11px;
      }

      .page-intro h1 {
        font-size: 26px;
      }

      .profile-glass {
        padding: 18px;
      }

      .information-header,
      .profile-form {
        padding-left: 16px;
        padding-right: 16px;
      }
    }
  </style>
</head>

<body>

  <main class="profile-page">

    <!-- BACK -->
    <a href="../index.html" class="back-link">
      <span>←</span>
      <span>Back to Shop</span>
    </a>


    <!-- PAGE TITLE -->
    <header class="page-intro">

      <span class="page-intro-label">
        MY ACCOUNT
      </span>

      <h1>
        Personal Information
      </h1>

    </header>


    <!-- MAIN -->
    <div class="profile-layout">


      <!-- GLASS PROFILE -->
      <aside class="profile-glass">

        <div class="profile-glass-content">

          <div class="avatar">
            R
          </div>

          <h2>
            Riyaz
          </h2>

          <p>
            Manage your personal information
            and account details.
          </p>

          <div class="glass-line"></div>

          <div class="profile-status">
            <span class="status-dot"></span>
            <span>Account active</span>
          </div>

        </div>

      </aside>


      <!-- PERSONAL INFORMATION -->
      <section class="information-card">


        <!-- HEADER -->
        <div class="information-header">

          <div>

            <h2>
              Personal Information
            </h2>

            <p>
              Keep your account details up to date.
            </p>

          </div>


          <button
            type="button"
            class="edit-btn"
            id="editBtn">

            Edit Profile

          </button>

        </div>


        <!-- FORM -->
        <form
          class="profile-form"
          id="profileForm">

          <div class="form-grid">


            <!-- FIRST NAME -->
            <div class="field">

              <label for="firstName">
                First Name
              </label>

              <input
                id="firstName"
                type="text"
                value="Riyaz"
                disabled
              >

            </div>


            <!-- LAST NAME -->
            <div class="field">

              <label for="lastName">
                Last Name
              </label>

              <input
                id="lastName"
                type="text"
                placeholder="Enter last name"
                disabled
              >

            </div>


            <!-- EMAIL -->
            <div class="field">

              <label for="email">
                Email Address
              </label>

              <input
                id="email"
                type="email"
                value="riyaz@example.com"
                disabled
              >

            </div>


            <!-- MOBILE -->
            <div class="field">

              <label for="mobile">
                Mobile Number
              </label>

              <input
                id="mobile"
                type="tel"
                value="+91 XXXXX XXXXX"
                disabled
              >

            </div>


            <!-- DOB -->
            <div class="field">

              <label for="dob">
                Date of Birth
              </label>

              <input
                id="dob"
                type="date"
                disabled
              >

            </div>


            <!-- GENDER -->
            <div class="field">

              <label for="gender">
                Gender
              </label>

              <select
                id="gender"
                disabled
              >

                <option value="">
                  Select
                </option>

                <option value="Male">
                  Male
                </option>

                <option value="Female">
                  Female
                </option>

                <option value="Other">
                  Other
                </option>

              </select>

            </div>


          </div>


          <!-- SAVE BUTTONS -->
          <div
            class="save-area"
            id="saveArea">

            <button
              type="button"
              class="cancel-btn"
              id="cancelBtn">

              Cancel

            </button>

            <button
              type="submit"
              class="save-btn">

              Save Changes

            </button>

          </div>


          <!-- SAVED MESSAGE -->
          <div
            class="saved-message"
            id="savedMessage">

            ✓ Your personal information has been saved.

          </div>

        </form>

      </section>

    </div>

  </main>


  <script>

    const editBtn =
      document.getElementById("editBtn");

    const cancelBtn =
      document.getElementById("cancelBtn");

    const saveArea =
      document.getElementById("saveArea");

    const savedMessage =
      document.getElementById("savedMessage");

    const form =
      document.getElementById("profileForm");


    const fields = [
      document.getElementById("firstName"),
      document.getElementById("lastName"),
      document.getElementById("email"),
      document.getElementById("mobile"),
      document.getElementById("dob"),
      document.getElementById("gender")
    ];


    /* SAVE ORIGINAL VALUES */

    let originalValues = {};

    function storeOriginalValues() {

      originalValues = {};

      fields.forEach(field => {
        originalValues[field.id] = field.value;
      });

    }


    /* ENABLE EDIT */

    editBtn.addEventListener("click", () => {

      storeOriginalValues();

      fields.forEach(field => {
        field.disabled = false;
      });

      editBtn.style.display = "none";

      saveArea.style.display = "flex";

      savedMessage.style.display = "none";

    });


    /* CANCEL */

    cancelBtn.addEventListener("click", () => {

      fields.forEach(field => {

        if (
          Object.prototype.hasOwnProperty.call(
            originalValues,
            field.id
          )
        ) {
          field.value =
            originalValues[field.id];
        }

        field.disabled = true;

      });

      saveArea.style.display = "none";

      editBtn.style.display = "block";

      savedMessage.style.display = "none";

    });


    /* SAVE */

    form.addEventListener("submit", event => {

      event.preventDefault();

      fields.forEach(field => {
        field.disabled = true;
      });

      saveArea.style.display = "none";

      editBtn.style.display = "block";

      savedMessage.style.display = "block";

      setTimeout(() => {

        savedMessage.style.display = "none";

      }, 3500);

    });

  </script>

</body>
</html>
